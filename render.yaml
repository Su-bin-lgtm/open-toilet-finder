services:
  - type: web
    name: open-toilet-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: off
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_DEMO_MODE
        value: "false"
      - key: VITE_NAVER_MAP_CLIENT_ID
        sync: false

  - type: web
    name: open-toilet-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    region: singapore
    plan: 1c-2g
    autoDeployTrigger: off
    healthCheckPath: /api/v1/toilets/search?keyword=__health__
    disk:
      name: toilet-images
      mountPath: /var/data/images
      sizeGB: 1
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TOILET_IMAGE_STORAGE_DIR
        value: /var/data/images
